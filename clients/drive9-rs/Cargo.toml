[package]
name = "drive9"
version = "0.1.0"
edition = "2021"

[features]
default = ["native-tls"]
# Desktop default behaviour. We have to re-state reqwest's default feature set
# explicitly: `[dependencies]` below sets `default-features = false` so callers
# can opt out of native-tls, which also drops charset/http2/system-proxy
# unless re-enabled here.
native-tls = [
    "reqwest/default-tls",
    "reqwest/charset",
    "reqwest/http2",
    "reqwest/system-proxy",
]
# Mobile-friendly TLS via rustls. Keep charset + http2 (mobile clients want
# both); drop system-proxy because reqwest's system-proxy targets desktop OS
# network settings and is the wrong thing on Android / iOS where the platform
# handles it.
rustls-tls = [
    "reqwest/rustls-tls",
    "reqwest/charset",
    "reqwest/http2",
]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
base64 = "0.22"
bytes = "1.6"
tokio = { version = "1.37", features = ["sync", "rt", "macros", "time", "fs", "io-util"] }
futures = "0.3"
url = "2.5"
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"
urlencoding = "2.1"

[dev-dependencies]
mockito = "1.4"
tokio = { version = "1.37", features = ["full"] }
tempfile = "3.10"
